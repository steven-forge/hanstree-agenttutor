name: Prepare and publish scheduled card news
on:
  workflow_dispatch:
  schedule:
    # The server stores the editable KST times and checks whether work is due.
    # GitHub schedules can be delayed; this is a five-minute check, not an exact-time guarantee.
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: prepare-card-news
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ vars.CARD_NEWS_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Run due preparation or publication with the server settings
        env:
          CARD_NEWS_PUBLIC_URL: ${{ vars.CARD_NEWS_PUBLIC_URL }}
          CARD_NEWS_CRON_SECRET: ${{ secrets.CARD_NEWS_CRON_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = os.environ.get('CARD_NEWS_PUBLIC_URL', '').rstrip('/')
          secret = os.environ.get('CARD_NEWS_CRON_SECRET', '')
          if not base.startswith('https://') or len(secret) < 32:
              raise SystemExit('Card news connection settings are missing.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          request = urllib.request.Request(base + '/api/admin/news/prepare', method='POST', headers={'Authorization': 'Bearer ' + secret})
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=320) as response:
                  result = json.load(response)
              print(json.dumps(result, ensure_ascii=False))
          except urllib.error.HTTPError as error:
              print('Card news automation failed, HTTP', error.code)
              try:
                  body = json.load(error)
                  run = body.get('run') if isinstance(body.get('run'), dict) else {}
                  safe = {k: run.get(k) for k in ('phase', 'date', 'message', 'cards', 'candidates', 'nextAttemptAt', 'lastTickAt')}
                  safe['error'] = body.get('error')
                  print(json.dumps({k: (v[:300] if isinstance(v, str) else v if isinstance(v, (int, float)) else None) for k, v in safe.items()}, ensure_ascii=False))
              except Exception:
                  pass
              raise SystemExit(1)
          except Exception:
              raise SystemExit('Card news automation did not complete; inspect admin status before retrying publication.')
          PY
