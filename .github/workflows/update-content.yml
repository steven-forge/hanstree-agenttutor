name: Update Content

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-content.yml'
      - 'scripts/collect_content.py'
      - 'scripts/collect_hourly_news.py'
      - 'scripts/news_policy.py'
  schedule:
    - cron: '15 21 * * *'  # 06:15 Asia/Seoul - 문서 확인 (뉴스 주기와 별개)
    - cron: '0 * * * *'    # 매시간 정책 동기화 후 KST 기준 뉴스 주기 판정
  workflow_dispatch:
    inputs:
      force_docs:
        description: '모든 문서 출처 강제 점검 (--force)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Sync public newsletter policy (fail closed)
        id: sync_policy
        run: python3 scripts/news_policy.py sync
        continue-on-error: true

      - name: Check newsletter collection interval
        id: news_schedule
        if: steps.sync_policy.outcome == 'success'
        env:
          POLICY_EVENT_NAME: ${{ github.event_name }}
          POLICY_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          NEWS_DUE="$(python3 scripts/news_policy.py due --event "$POLICY_EVENT_NAME" --schedule "$POLICY_EVENT_SCHEDULE")"
          echo "run=$NEWS_DUE" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Collect official news and releases with synced policy
        id: collect_news
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEWS_COLLECTION_DUE: ${{ steps.sync_policy.outcome == 'success' && steps.news_schedule.outcome == 'success' && steps.news_schedule.outputs.run == 'true' }}
        run: |
          if [ "$NEWS_COLLECTION_DUE" = "true" ]; then
            python3 scripts/collect_content.py news
          else
            python3 scripts/collect_content.py news --releases-only
          fi
        continue-on-error: true

      - name: Check document sources
        id: collect_docs
        if: github.event.schedule == '15 21 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FORCE_DOCS: ${{ inputs.force_docs == true && 'true' || 'false' }}
        run: |
          if [ "$FORCE_DOCS" = "true" ]; then
            python3 scripts/collect_content.py documents --force
          else
            python3 scripts/collect_content.py documents
          fi
        continue-on-error: true

      - name: Collect hourly news (external sources, auto-publish)
        id: collect_hourly
        if: steps.sync_policy.outcome == 'success' && steps.news_schedule.outcome == 'success' && steps.news_schedule.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ vars.ENABLE_YOUTUBE_NEWS == 'true' && secrets.YOUTUBE_API_KEY || '' }}
          X_BEARER_TOKEN: ${{ vars.ENABLE_X_NEWS == 'true' && secrets.X_BEARER_TOKEN || '' }}
          REDDIT_CLIENT_ID: ${{ vars.ENABLE_REDDIT_NEWS == 'true' && secrets.REDDIT_CLIENT_ID || '' }}
          REDDIT_CLIENT_SECRET: ${{ vars.ENABLE_REDDIT_NEWS == 'true' && secrets.REDDIT_CLIENT_SECRET || '' }}
        run: python3 scripts/collect_hourly_news.py
        continue-on-error: true

      - name: Build Next.js
        run: npm run build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/news-policy.json data/today.json data/today-candidates.json data/content-health.json .source-cache/content.json)" ]; then
            git add data/news-policy.json data/today.json data/today-candidates.json data/content-health.json .source-cache/content.json
            git commit -m "chore(content): 뉴스 archive·후보 및 문서 출처 점검 갱신"
            git pull --rebase origin master
            git push origin master
          else
            echo "No changes detected in candidates, health, or cache. Skipping push."
          fi

      - name: Check collection step outcome
        if: always()
        run: |
          if [ "${{ steps.sync_policy.outcome }}" = "failure" ] || [ "${{ steps.news_schedule.outcome }}" = "failure" ] || [ "${{ steps.collect_news.outcome }}" = "failure" ] || [ "${{ steps.collect_docs.outcome }}" = "failure" ] || [ "${{ steps.collect_hourly.outcome }}" = "failure" ]; then
            echo "Error: Policy synchronization, scheduling, or content collection failed. Newsletter publishing stays blocked when policy synchronization fails."
            exit 1
          fi
